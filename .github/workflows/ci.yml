name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      AISTORE_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/ai_artifact_store_test

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_artifact_store_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d ai_artifact_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            pkg-config \
            postgresql-client

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          ninja --version
          psql --version
          "$HOME/vcpkg/vcpkg" version

      - name: Apply database migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/001_initial_schema.sql

          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/002_separate_object_layouts.sql

          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/003_content_addressed_artifact_versions.sql

          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/004_manifest_and_run_models.sql

          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/005_upload_sessions.sql

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build-ci

      - name: Run tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Run CLI smoke test
        run: ./build-ci/aistore

      - name: Verify service binaries
        run: |
          test -x ./build-ci/storage-node
          test -x ./build-ci/metadata-service

      - name: Run storage-node API smoke test
        run: |
          set -euo pipefail

          storage_root="$(mktemp -d)"
          storage_pid=""

          cleanup() {
            if [[ -n "${storage_pid}" ]] && kill -0 "${storage_pid}" 2>/dev/null; then
              kill "${storage_pid}"
              wait "${storage_pid}" || true
            fi

            rm -rf "${storage_root}"
          }

          trap cleanup EXIT

          AISTORE_STORAGE_ROOT="${storage_root}" ./build-ci/storage-node &
          storage_pid=$!

          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:8081/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "storage-node did not become ready" >&2
            exit 1
          fi

          chunk_id="ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"

          curl -fsS \
            -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary "abc" \
            "http://127.0.0.1:8081/v1/chunks/${chunk_id}"

          output_file="$(mktemp)"
          curl -fsS \
            -o "${output_file}" \
            "http://127.0.0.1:8081/v1/chunks/${chunk_id}"

          printf 'abc' | cmp -s - "${output_file}"

          kill "${storage_pid}"
          wait "${storage_pid}" || true
          storage_pid=""

          rm -f "${output_file}"

      - name: Run metadata-service API smoke test
        run: |
          set -euo pipefail

          chunk_id="ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          metadata_pid=""

          cleanup() {
            if [[ -n "${metadata_pid}" ]] && kill -0 "${metadata_pid}" 2>/dev/null; then
              kill "${metadata_pid}"
              wait "${metadata_pid}" || true
            fi
          }

          trap cleanup EXIT

          psql "${AISTORE_TEST_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO chunks (chunk_id, size_bytes) VALUES ('${chunk_id}', 3) ON CONFLICT (chunk_id) DO NOTHING;"

          AISTORE_DB_URL="${AISTORE_TEST_DB_URL}" ./build-ci/metadata-service &
          metadata_pid=$!

          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:8080/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "metadata-service did not become ready" >&2
            exit 1
          fi

          curl -fsS \
            -X PUT \
            -H "Content-Type: application/json" \
            --data-binary '{"storage_path":"/ci/storage/abc","state":"available"}' \
            "http://127.0.0.1:8080/v1/chunks/${chunk_id}/locations/ci-node"

          response="$(curl -fsS "http://127.0.0.1:8080/v1/chunks/${chunk_id}/locations")"

          case "${response}" in
            *"${chunk_id}"*ci-node*/ci/storage/abc*available*)
              ;;
            *)
              echo "unexpected location response: ${response}" >&2
              exit 1
              ;;
          esac

          artifact_id="018f1f7e-7b3c-7000-8000-000000000001"
          session_id="018f1f7e-7b3c-7000-8000-000000000002"

          psql "${AISTORE_TEST_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO artifacts (artifact_id, name, project) VALUES ('${artifact_id}'::uuid, 'ci-m4s2-artifact', 'ci-m4s2-project') ON CONFLICT (artifact_id) DO NOTHING;"

          session_response="$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary "{\"session_id\":\"${session_id}\",\"artifact_id\":\"${artifact_id}\",\"target_node_id\":\"ci-node\",\"chunking_strategy\":\"fixed-size\",\"chunk_size_bytes\":4194304,\"parent_version_id\":null,\"immutable_metadata\":{\"source\":\"ci\"}}" \
            "http://127.0.0.1:8080/v1/upload-sessions")"

          case "${session_response}" in
            *"${session_id}"*"${artifact_id}"*ci-node*open*)
              ;;
            *)
              echo "unexpected upload session create response: ${session_response}" >&2
              exit 1
              ;;
          esac

          get_session_response="$(curl -fsS "http://127.0.0.1:8080/v1/upload-sessions/${session_id}")"

          case "${get_session_response}" in
            *"${session_id}"*"${artifact_id}"*ci-node*open*)
              ;;
            *)
              echo "unexpected upload session get response: ${get_session_response}" >&2
              exit 1
              ;;
          esac

          negotiate_response="$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary "{\"session_id\":\"${session_id}\",\"chunks\":[{\"chunk_id\":\"${chunk_id}\",\"size_bytes\":3}]}" \
            "http://127.0.0.1:8080/v1/chunks/negotiate")"

          case "${negotiate_response}" in
            *metadata_was_known\":true*available_on_target*ci-node*)
              ;;
            *)
              echo "unexpected negotiate response: ${negotiate_response}" >&2
              exit 1
              ;;
          esac

          abort_response="$(curl -fsS \
            -X POST \
            "http://127.0.0.1:8080/v1/upload-sessions/${session_id}/abort")"

          case "${abort_response}" in
            *aborted*)
              ;;
            *)
              echo "unexpected abort response: ${abort_response}" >&2
              exit 1
              ;;
          esac

          kill "${metadata_pid}"
          wait "${metadata_pid}" || true
          metadata_pid=""

          psql "${AISTORE_TEST_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "DELETE FROM upload_sessions WHERE session_id = '${session_id}'::uuid;"
          psql "${AISTORE_TEST_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "DELETE FROM artifacts WHERE artifact_id = '${artifact_id}'::uuid;"
          psql "${AISTORE_TEST_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "DELETE FROM storage_locations WHERE chunk_id = '${chunk_id}' AND node_id = 'ci-node';"
          psql "${AISTORE_TEST_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "DELETE FROM chunks WHERE chunk_id = '${chunk_id}';"
