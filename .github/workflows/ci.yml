name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      AISTORE_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/ai_artifact_store_test

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_artifact_store_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d ai_artifact_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            pkg-config \
            postgresql-client

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          ninja --version
          psql --version
          "$HOME/vcpkg/vcpkg" version

      - name: Apply database migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/001_initial_schema.sql

          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/002_separate_object_layouts.sql

          psql \
            -h localhost \
            -U postgres \
            -d ai_artifact_store_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/003_content_addressed_artifact_versions.sql

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build-ci

      - name: Run tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Run CLI smoke test
        run: ./build-ci/aistore
        